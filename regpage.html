<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel = "stylesheet" href="css/style.css">
    <script src="scirpts/script.js" defer></script>
    <link rel="icon" href="assets/images/favicon levelUp.svg">
</head>
<body>
    <div class="blank-container">
        <div class="blank-box">
            <div class="blank">
                <h2>Регистрация</h2>
                <input class="field" placeholder="Имя пользователя">
                <input class="field" placeholder="Номер телефона">
                <input class="field" placeholder="Почта">
                <input class="field" placeholder="Пароль">
                <input class="field" placeholder="Подтвердить пароль">
            </div>
            <div class="blank">
                <h2>Персонализация</h2>
                <input class="field" placeholder="Основная игра">
                <input class="field" placeholder="Платформа">
                <input class="field" placeholder="Мотивация" style="padding-bottom: 100px;">
                <div class="checkbox-container">
                    <div class="checkbox"></div>
                    Согласен с политикой конфидециальности
                </div>
                <div class="checkbox-container">
                    <div class="checkbox"></div>
                    Согласен с обработкой персональных данных
                </div>
            </div>
            <div class="blank-btns-container">
                <button class="classic-btn leave-btn" onclick="eventshtml()">
                    <p>Назад</p>
                </button>
                <button class="classic-btn" onclick="page404()">
                    <p>Зарегистрироваться</p>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
